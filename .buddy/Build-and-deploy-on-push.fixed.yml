- pipeline: build-and-deploy-on-push
  name: Build and deploy on push
  refs:
  - refs/heads/master
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  - type: PUSH
  actions:
  - action: nosetests
    type: BUILD
    commands: |-
      pip install pipenv
      pipenv install
      pipenv run python3 tests.py
    cached_dirs:
    - /root/.cache/pip
    shell: BASH
    docker_image_name: library/python
    docker_image_tag: 3.14
